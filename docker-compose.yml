# Minimal bring-up: `docker compose up` and the stack is running.
#
# No database service is required. The API creates its schema and seeds itself
# on startup (backend/app/db/bootstrap.py), defaulting to a local SQLite file.
# Uncomment the `db` service and DATABASE_URL below to run against Postgres.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - POLL_INTERVAL_MINUTES=15
      # - DATABASE_URL=postgresql+asyncpg://orca_user:orca_password@db/orca_db
    ports:
      - "8000:8000"
    volumes:
      - orca_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # db:
  #   image: postgres:15-alpine
  #   environment:
