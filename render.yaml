services:
  - type: web
    name: orca-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    region: singapore # Closest to India for reduced latency
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orca-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: orca-redis
          property: connectionString

databases:
  - name: orca-db
    databaseName: orca_db
    user: orca_user
    plan: free
    region: singapore

redis:
  - name: orca-redis
    plan: free
    region: singapore
    ipAllowList: [] # Allow all internal Render connections
