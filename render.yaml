services:
  - type: web
    name: orca-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    region: singapore # closest to India
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Optional. Leave unset and the API runs on a local SQLite file, which is
      # enough for the prototype. Set it to a postgresql+asyncpg:// URL to use
      # a managed Postgres instead.
      - key: DATABASE_URL
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "15"
