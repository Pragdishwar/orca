services:
  - type: web
    name: orca-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    region: singapore # Closest to India for reduced latency
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # You will manually paste your Supabase Connection String here in the Render Dashboard
      - key: REDIS_URL
        fromService:
          type: redis
          name: orca-redis
          property: connectionString

  - type: redis
    name: orca-redis
    plan: free
    region: singapore
    ipAllowList: [] # Allow all internal Render connections
